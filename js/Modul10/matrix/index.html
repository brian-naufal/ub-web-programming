<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  </head>
  <body>
    <script>
      const A = tf.tensor2d([
        [1, 2],
        [3, 4],
      ]);
      const B = tf.tensor2d([
        [5, 6],
        [7, 8],
      ]);

      const transposeA = A.transpose();
      transposeA.print();

      const penjumlahan = tf.add(A, B);
      penjumlahan.print();

      const perkalian = tf.matMul(A, B);
      perkalian.print();

      const inverseA = tf.linalg.inverse(A);
      inverseA.print();
    </script>
  </body>
</html>
